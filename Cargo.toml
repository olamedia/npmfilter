[package]
name = "npmfilter"
version = "0.3.0"
edition = "2024"
description = "Local npm registry filtering daemon: release-age and install-script gates with content-pinned manual approval"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.5", features = ["derive"] }
flate2 = "1.1"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
rmcp = { version = "3.1.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

# DESIGN.md "Packaging" — cargo-deb producing npmfilter_0.1.0_amd64.deb.
[package.metadata.deb]
maintainer = "olamedia <olamedia@gmail.com>"
copyright = "2026, olamedia <olamedia@gmail.com>"
# DESIGN.md names the artifact `npmfilter_0.1.0_amd64.deb`; an empty revision
# drops cargo-deb's default `-1`.
revision = ""
section = "utils"
priority = "optional"
extended-description = """\
npmfilter is a local npm registry proxy that gates resolution. It fetches the \
full packument upstream, withholds every version younger than min_age_days and \
every version carrying a preinstall/install/postinstall hook, and re-serializes \
what is left into whichever shape the client asked for. Tarballs are not \
proxied: dist.tarball keeps pointing at the upstream registry, so lockfiles \
stay portable and no package bytes transit the daemon.

Approvals are pinned to the version's dist.integrity plus a sha256 of the exact \
script commands, and are granted over MCP so an agent can inspect a package \
before unblocking it. Every version ever observed is recorded, so a published \
version whose hash later changes is blocked as tampering.

The gate is resolution-time only: `npm ci` against an existing lockfile does \
not consult it. Approvals are recorded only by the daemon, over a Unix control \
socket; the MCP shim and the CLI are clients of it and never open the state \
database."""
assets = [
    ["target/release/npmfilter", "usr/bin/npmfilter", "755"],
    ["packaging/config.toml", "etc/npmfilter/config.toml", "644"],
    ["README.md", "usr/share/doc/npmfilter/README.md", "644"],
    ["USAGE.md", "usr/share/doc/npmfilter/USAGE.md", "644"],
    ["SECURITY.md", "usr/share/doc/npmfilter/SECURITY.md", "644"],
]
maintainer-scripts = "packaging/debian"

# Installing a .deb is not consent to start a daemon that every `npm install` on
# the machine will then depend on. The unit is installed and left alone; postinst
# prints the exact commands to adopt it.
[package.metadata.deb.systemd-units]
unit-scripts = "packaging/systemd"
unit-name = "npmfilter"
enable = false
start = false
restart-after-upgrade = false

# RPM, via cargo-generate-rpm. The same payload as the .deb: the binary, the
# conffile, the docs and the unit. `enable`/`start` are deliberately absent here
# too — installing a package is not consent to start a daemon that every
# `npm install` on the machine will then depend on.
[package.metadata.generate-rpm]
summary = "Local npm registry filtering daemon"
license = "UNLICENSED"
assets = [
    { source = "target/release/npmfilter", dest = "/usr/bin/npmfilter", mode = "755" },
    { source = "packaging/config.toml", dest = "/etc/npmfilter/config.toml", mode = "644", config = true },
    { source = "packaging/systemd/npmfilter.service", dest = "/usr/lib/systemd/system/npmfilter.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/npmfilter/README.md", mode = "644", doc = true },
    { source = "USAGE.md", dest = "/usr/share/doc/npmfilter/USAGE.md", mode = "644", doc = true },
    { source = "SECURITY.md", dest = "/usr/share/doc/npmfilter/SECURITY.md", mode = "644", doc = true },
]
post_install_script = """
getent group npmfilter >/dev/null || groupadd --system npmfilter
getent passwd npmfilter >/dev/null || useradd --system --gid npmfilter \
    --home-dir /var/lib/npmfilter --no-create-home \
    --shell /sbin/nologin --comment "npmfilter registry filtering daemon" npmfilter
if [ -d /var/lib/npmfilter ] && [ ! -L /var/lib/npmfilter ]; then
    chown -h npmfilter:npmfilter /var/lib/npmfilter || :
    chmod 0700 /var/lib/npmfilter || :
fi
%systemd_post npmfilter.service
cat <<'NOTICE'

npmfilter is installed. It is NOT running, and it is NOT enabled.

    sudo systemctl enable --now npmfilter

Nothing resolves through it until you adopt it — see
/usr/share/doc/npmfilter/README.md. Seed first:

    npmfilter seed ~/your-project --dry-run

The threat model, including what is explicitly NOT defended, is in
/usr/share/doc/npmfilter/SECURITY.md.

NOTICE
"""
pre_uninstall_script = """
%systemd_preun npmfilter.service
"""
post_uninstall_script = """
%systemd_postun_with_restart npmfilter.service
"""
