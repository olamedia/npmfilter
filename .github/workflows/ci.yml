name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default. The release job widens this for itself only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A dependency that fails to build should fail the job, not retry for ten minutes.
  CARGO_NET_RETRY: 2
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # reqwest 0.13 defaults to rustls over aws-lc, whose C sources are built with cmake.
      # The hosted images ship it, but a runner that does not would fail deep inside a
      # dependency build with a message that does not name the cause.
      - name: Build dependencies for aws-lc
        run: |
          command -v cmake >/dev/null || {
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y cmake
          }
          cmake --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      # The suite is hermetic: every test runs against fixtures or a stub bound to
      # port 0, never registry.npmjs.org. A green run here means the policy engine
      # and the proxy agree, not that the network happened to cooperate.
      - name: Tests
        run: cargo test --all-features

  package:
    name: package (${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            tool: cargo-deb
            build: cargo deb --no-build --no-strip
            out: target/debian
          - kind: rpm
            tool: cargo-generate-rpm
            build: cargo generate-rpm
            out: target/generate-rpm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.kind }}

      # reqwest 0.13 defaults to rustls over aws-lc, whose C sources are built with cmake.
      # The hosted images ship it, but a runner that does not would fail deep inside a
      # dependency build with a message that does not name the cause.
      - name: Build dependencies for aws-lc
        run: |
          command -v cmake >/dev/null || {
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y cmake
          }
          cmake --version

      # Both packagers consume target/release/npmfilter. cargo-deb would build it
      # itself, but doing it explicitly keeps the two matrix legs identical and lets
      # `--no-build` reuse exactly what was tested here.
      - name: Build release binary
        run: cargo build --release --locked

      - name: Install ${{ matrix.tool }}
        run: cargo install ${{ matrix.tool }} --locked

      - name: Build ${{ matrix.kind }}
        run: ${{ matrix.build }}

      # A package that builds but ships the wrong payload is worse than one that
      # fails, because nothing downstream notices. Assert the contents.
      - name: Verify package contents
        run: |
          set -euo pipefail
          artifact=$(find "${{ matrix.out }}" -type f -name "*.${{ matrix.kind }}" -print -quit)
          test -n "$artifact"
          echo "artifact: $artifact"
          if [ "${{ matrix.kind }}" = "deb" ]; then
            listing=$(dpkg-deb -c "$artifact" | awk '{print $6}' | sed 's|^\./|/|')
          else
            listing=$(rpm -qlp "$artifact")
          fi
          echo "$listing"
          for required in \
            /usr/bin/npmfilter \
            /etc/npmfilter/config.toml \
            /usr/lib/systemd/system/npmfilter.service \
            /usr/share/doc/npmfilter/README.md \
            /usr/share/doc/npmfilter/USAGE.md \
            /usr/share/doc/npmfilter/SECURITY.md
          do
            echo "$listing" | grep -qx "$required" || { echo "missing from package: $required" >&2; exit 1; }
          done
          # The state database records which packages an operator approved. It is
          # created at runtime and must never be shipped.
          if echo "$listing" | grep -qE '\.db$|\.env$'; then
            echo "package ships runtime state or secrets" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: npmfilter-${{ matrix.kind }}
          path: ${{ matrix.out }}/*.${{ matrix.kind }}
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the release and upload the packages to it
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "npmfilter $TAG" \
            --generate-notes \
            dist/*
